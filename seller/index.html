<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B3A66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seller">
<title>Seller Tools</title>
<link rel="icon" href="../images/icon-72.png">
<link rel="apple-touch-icon" href="../images/icon.png">
<style>
  :root { --bg: #F4F6F9; --card: #fff; --ink: #1B2430; --muted: #5B6675; --line: #D8DEE6; --accent: #0B3A66; --ok: #1E7B3A; --warn: #FFF8E6; --warnline: #F5D98B; --bad: #B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F151C; --card: #18212B; --ink: #E7ECF2; --muted: #9AA6B4; --line: #2A3542; --accent: #7FB2E5; --ok: #6CCB86; --warn: #2C2615; --warnline: #5C4D1E; --bad: #FF8A80; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: #0B3A66; color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header button { background: transparent; color: #fff; border: 1px solid #ffffff66; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 10px 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  input[type=tel], .ltr { direction: ltr; }
  button { font: inherit; border-radius: 8px; padding: 10px 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: #0B3A66; color: #fff; border-color: #0B3A66; font-weight: 600; width: 100%; padding: 13px; margin-top: 14px; }
  button.wa { background: #1E7B3A; color: #fff; border-color: #1E7B3A; font-weight: 600; width: 100%; padding: 13px; margin-top: 10px; }
  button:disabled { opacity: .55; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; } .chips button { flex: 1; padding: 8px 6px; }
  .chips button.on { background: #0B3A66; color: #fff; border-color: #0B3A66; }
  .muted { color: var(--muted); font-size: 14px; } .bad { color: var(--bad); } .okc { color: var(--ok); }
  .total { font-size: 22px; font-weight: 700; color: var(--accent); margin-top: 12px; }
  .note { background: var(--warn); border: 1px solid var(--warnline); border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-top: 10px; }
  .cust { display: block; width: 100%; text-align: start; margin: 8px 0; padding: 12px; border-radius: 10px; }
  .cust b { display: block; } .cust .tag { font-size: 13px; font-weight: 600; color: var(--accent); }
  textarea { width: 100%; font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; height: 90px; direction: ltr; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><h1>Seller Tools</h1><button id="lockBtn" hidden>Lock</button></header>
<main>

  <section id="login" class="card">
    <b>Open with your passwords</b>
    <p class="muted">Your customer list password, then the phone passphrase you chose in Seller Tools → Customers → Phone. Nothing is saved on this phone.</p>
    <label for="pw">Customer list password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <label for="pass">Phone passphrase</label>
    <input id="pass" type="password" autocomplete="off">
    <button id="openBtn" class="primary">Open</button>
    <p id="loginMsg" class="muted" role="status"></p>
  </section>

  <section id="list" hidden>
    <div class="row"><button id="newBtn">+ New customer</button><button id="refreshBtn">Refresh</button></div>
    <p id="listMsg" class="muted" role="status"></p>
    <div id="customers"></div>
  </section>

  <section id="form" class="card" hidden>
    <button id="backBtn">← Customers</button>
    <label for="company">Company name (as on their quotes)</label>
    <input id="company" autocomplete="off">
    <label for="phone">Their WhatsApp number</label>
    <input id="phone" type="tel" autocomplete="off">
    <div class="row">
      <div><label for="users">Users</label><input id="users" type="number" inputmode="numeric" min="1" max="999"></div>
      <div><label for="paidBy">Paid by</label><select id="paidBy"><option>Cash</option><option>Qi Card</option></select></div>
    </div>
    <label>Months</label>
    <div class="chips" id="monthChips"><button data-m="1">1</button><button data-m="3">3</button><button data-m="6">6</button><button data-m="12">12</button></div>
    <p id="period" class="muted"></p>
    <div id="renewal" class="note" hidden><span id="renewalText"></span> <button id="todayBtn" style="padding:4px 8px;margin-top:6px">Start today instead</button></div>
    <label style="display:flex;gap:8px;align-items:center"><input id="receipt" type="checkbox" checked style="width:auto"> Make a receipt at the price list</label>

    <div id="total" class="total">–</div>
    <button id="makeBtn" class="primary">Make licence key</button>
    <p id="formMsg" class="muted" role="status"></p>
  </section>

  <section id="done" class="card" hidden>
    <b class="okc">✓ Key made</b>
    <p id="doneText" class="muted"></p>
    <textarea id="keyBox" readonly></textarea>
    <button id="sendBtn" class="wa">Send key and receipt on WhatsApp</button>
    <div class="row" style="margin-top:10px"><button id="copyBtn">Copy key</button><button id="sendKeyBtn">Key only</button></div>
    <button id="againBtn" style="width:100%;margin-top:10px">← Customers</button>
  </section>

</main>
<script type="module">
import * as R from "./remote.js";

const $ = (id) => document.getElementById(id);
const show = (id) => { for (const s of ["login", "list", "form", "done"]) $(s).hidden = s !== id; $("lockBtn").hidden = id === "login"; };
let password = null, signer = null, rows = [], start = null, months = 12, current = null, made = null, idle = null;

const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

function lock(message = "") {
  password = null; signer = null; rows = []; made = null;
  $("pw").value = ""; $("pass").value = ""; $("keyBox").value = "";
  $("loginMsg").textContent = message; show("login");
}
// Locks by itself after 10 minutes without a tap, and when the page is left in the background.
function touch() { clearTimeout(idle); if (signer) idle = setTimeout(() => lock("Locked after 10 minutes."), 600000); }
for (const ev of ["click", "input", "touchstart"]) document.addEventListener(ev, touch, { passive: true });
document.addEventListener("visibilitychange", () => { if (document.hidden && signer) setTimeout(() => { if (document.hidden && signer) lock("Locked while the page was in the background."); }, 120000); });
$("lockBtn").onclick = () => lock("Locked.");

$("openBtn").onclick = async () => {
  const pw = $("pw").value, pass = $("pass").value;
  if (!pw || !pass) { $("loginMsg").textContent = "Enter both."; return; }
  $("openBtn").disabled = true; $("loginMsg").textContent = "Opening…";
  try {
    const { locked } = await R.rpc("seller_phone_key", { p_password: pw });
    $("loginMsg").textContent = "Unlocking the key…";
    let key;
    try { key = await R.unlockKey(locked, pass); }
    catch (e) { throw new Error(e.message === "wrong passphrase" ? "Wrong phone passphrase." : e.message); }
    if (locked.public !== R.PUBLIC_KEY) throw new Error("This key isn't the one Solar Sizer trusts. Turn the phone on again in Seller Tools.");
    password = pw; signer = key; touch();
    $("pw").value = ""; $("pass").value = "";
    await loadList();
  } catch (e) { $("loginMsg").innerHTML = `<span class="bad">${escapeHtml(e.message)}</span>`; }
  finally { $("openBtn").disabled = false; }
};

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function loadList() {
  show("list"); $("listMsg").textContent = "Loading…";
  try {
    const all = await R.rpc("seller_customers", { p_password: password });
    const now = R.today();
    rows = (all.installs ?? []).map((r) => R.customer(r, now));
    const order = (c) => c.wantsLicence ? 0 : c.status === "On trial" && c.daysLeft <= 7 ? 1 : c.status === "Subscribed" && c.daysLeft <= 30 ? 2 : 9;
    rows.sort((a, b) => order(a) - order(b) || (b.lastSeen ?? 0) - (a.lastSeen ?? 0));
    $("customers").innerHTML = rows.map((c, i) => `<button class="cust card" data-i="${i}">
        ${c.wantsLicence ? '<span class="tag">🔔 Wants a key</span>' : `<span class="muted">${escapeHtml(c.status)}${c.daysLeft != null ? ` · ${c.daysLeft} day(s) left` : ""}</span>`}
        <b>${escapeHtml(c.company || "(no name)")}</b>
        <span class="muted ltr">${escapeHtml(c.phone)}</span>
        ${c.wantsLicence ? `<span class="muted"> · ${c.users} user(s), ${c.months} month(s), ${escapeHtml(c.paidBy)}${c.note ? ": " + escapeHtml(c.note) : ""}</span>` : ""}
      </button>`).join("") || '<p class="muted">No computers in the list yet.</p>';
    $("listMsg").textContent = `${rows.length} computer(s) · updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    if (/password/i.test(e.message)) { lock(e.message); return; }
    $("listMsg").innerHTML = `<span class="bad">${escapeHtml(e.message)}</span>`;
  }
}
$("refreshBtn").onclick = loadList;
$("customers").onclick = (e) => { const b = e.target.closest("[data-i]"); if (b) openForm(rows[+b.dataset.i]); };
$("newBtn").onclick = () => openForm(null);
$("backBtn").onclick = $("againBtn").onclick = () => { made = null; loadList(); };

function openForm(c) {
  current = c; made = null;
  $("company").value = c?.company ?? ""; $("phone").value = c?.phone ?? ""; $("users").value = c?.users ?? 3; $("paidBy").value = c?.paidBy ?? "Cash";
  $("receipt").checked = true;
  const p = R.renewalPeriod(R.today(), c?.licenceEnd ?? null, c?.months ?? 12);
  start = p.from; setMonths(p.months); $("formMsg").textContent = ""; show("form");
}
function setMonths(m) {
  months = m;
  for (const b of $("monthChips").children) b.classList.toggle("on", +b.dataset.m === m);
  update();
}
$("monthChips").onclick = (e) => { const b = e.target.closest("[data-m]"); if (b) setMonths(+b.dataset.m); };
$("todayBtn").onclick = () => { start = R.today(); update(); };
$("users").oninput = $("receipt").onchange = update;

function update() {
  const until = R.addMonths(start, months), renewal = start > R.today();
  $("period").textContent = `Valid ${R.dmy(start)} to ${R.dmy(until)}`;
  $("renewal").hidden = !renewal;
  $("renewalText").textContent = renewal ? `Renewal: the paid period starts on ${R.dmy(start)}, when their current key ends.` : "";
  const users = parseInt($("users").value, 10);
  if (users > 0 && $("receipt").checked) {
    const q = R.priceFor(users, months);
    $("total").textContent = `${q.total.toLocaleString("en-US")} IQD` + (q.discountPct ? `  (${q.discountPct}% off)` : "");
  } else $("total").textContent = "–";
}

$("makeBtn").onclick = async () => {
  const company = $("company").value.trim(), users = parseInt($("users").value, 10);
  const priced = $("receipt").checked;
  if (!company) { $("formMsg").textContent = "Enter the company name."; return; }
  if (!(users >= 1 && users <= 999)) { $("formMsg").textContent = "Enter the number of users (1 or more)."; return; }

  if (!signer) { lock("Locked."); return; }
  $("makeBtn").disabled = true; $("formMsg").textContent = "Making the key…";
  try {
    const issued = R.today(), until = R.addMonths(start, months), id = R.newId();
    const key = await R.makeLicence(signer, { company, until, users, issued, id });
    if (!(await R.licenceIsGenuine(key))) throw new Error("The key didn't pass Solar Sizer's check. It was not saved.");
    const q = priced ? R.priceFor(users, months) : null;
    const paidBy = $("paidBy").value;

    made = { key, company, phone: $("phone").value.trim(), receipt: q ? R.receipt(id, issued, company, until, users, q, paidBy, start) : "" };
    $("keyBox").value = key;
    $("doneText").textContent = `${company}: ${users} user(s), valid until ${R.dmy(until)}` + (q ? ` · ${q.total.toLocaleString("en-US")} IQD` : "") + ".";
    show("done");
    try {
      await R.rpc("seller_licence_made", { p_password: password, p_info: {
        id, company, users, until: R.isoDay(until), months: q?.months ?? null, total: q?.total ?? null, paid_by: q ? paidBy : "",
        from: "phone", start: R.isoDay(start), install_id: current?.id ?? null } });
      $("doneText").textContent += " Added to your customer list.";
    } catch (e) { $("doneText").textContent += ` Not added to the customer list (${e.message}): note it yourself.`; }
  } catch (e) { $("formMsg").innerHTML = `<span class="bad">${escapeHtml(e.message)}</span>`; }
  finally { $("makeBtn").disabled = false; }
};

function whatsapp(text) {
  const d = R.whatsappDigits(made?.phone);
  location.href = `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}
$("sendBtn").onclick = () => made && whatsapp(R.keyMessage(made.company, made.key) + (made.receipt ? "\n\n" + made.receipt : ""));
$("sendKeyBtn").onclick = () => made && whatsapp(R.keyMessage(made.company, made.key));
$("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText($("keyBox").value); $("copyBtn").textContent = "Copied ✓"; } catch { $("keyBox").select(); } };

if (!globalThis.crypto?.subtle) { $("loginMsg").innerHTML = '<span class="bad">This browser can\'t make keys. Open the page in Chrome or Safari.</span>'; $("openBtn").disabled = true; }
</script>
</body>
</html>
